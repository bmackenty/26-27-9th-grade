<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Generator</title>
</head>
<body>
    <h1>My Generator</h1>
    <p>Welcome! This application generates random fantasy items.</p>
    <button type="button" id="generate-button">Generate</button>
    <p id="result" aria-live="polite">Press the button to generate an item.</p>
    <h2>Example results</h2>
    <ul>
        <li>Ancient Sword</li>
        <li>Rusty Shield</li>
        <li>Glowing Staff</li>
    </ul>
    <p><a href="/api/generate">Open the generator data</a></p>
    <script src="/static/script.js"></script>
</body>
</html>
